<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Collection — Photography by Sthitapragna Kollepara</title>
  <meta name="description" content="Every photograph in one place — click any thumbnail to open it full screen, or run the whole set as a slideshow." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />

  <script>
    // Inline and blocking on purpose: setting this after first paint shows a
    // flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-gallery">

  <!-- ===================== NAV ===================== -->
  <header class="nav" id="nav">
    <div class="wrap nav-row">
      <a class="wordmark" href="index.html" aria-label="Sthitapragna Kollepara — home">
        <span class="glyph ring-pill" aria-hidden="true">KSP</span>
        <span class="wordmark-name">Sthitapragna Kollepara</span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a class="nav-pill nav-pill--quiet" href="index.html#work">Design Projects</a>
        <a class="nav-pill nav-pill--photo" href="photography.html">Photography Page <svg class="nav-ico" width="12" height="12" viewBox="3.43 3.43 17.14 17.14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.29" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
        <a class="nav-pill ring-pill" href="collection.html" aria-current="page">View the entire collection</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top" class="gallery">

    <header class="gallery-head">
      <h1 class="display gallery-title">The entire collection</h1>
      <p class="gallery-lede">
        Every photograph in one place. Click any thumbnail to open it, step
        through with the chevrons, or play the whole pool as a slideshow.
      </p>
      <div class="reel-actions reel-actions--lead">
        <button class="reel-play" type="button" data-pool-play>
          <span class="reel-play-dot" aria-hidden="true">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
          </span>
          Play the whole collection
        </button>
      </div>
    </header>

    <div class="pool" data-pool>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-01.jpg" alt="A sailor in whites standing at the end of a pier, silhouetted against an orange sea and sky" width="1659" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-02.jpg" alt="A naval helicopter hovering with a line down to the water, a tall ship under full sail behind" width="900" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-03.jpg" alt="A paratrooper descending under a tricolour canopy" width="693" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-04.jpg" alt="A fighter jet banking through a hazy orange sky, afterburners lit" width="835" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-05.jpg" alt="A fighter jet seen from below in pale grey sky, twin afterburner trails behind" width="719" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-06.jpg" alt="A fighter jet in silhouette climbing against a dusty pink sky, vapour streaming from the wings" width="793" height="900" loading="lazy" decoding="async" />
        </button>
        <button class="pool-item" type="button">
          <img src="assets/photography/av-07.jpg" alt="A helicopter and a jet releasing flares over a warship at dusk" width="1549" height="900" loading="lazy" decoding="async" />
        </button>
    </div>
  </main>

  <!-- ===================== LIGHTBOX ===================== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
    <div class="lightbox-top">
      <p class="lightbox-caption"></p>
      <button class="lightbox-close" type="button" aria-label="Close viewer">
        <svg width="16" height="16" viewBox="1.33 1.33 21.33 21.33" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <button class="lightbox-nav lightbox-nav--prev" type="button" aria-label="Previous photograph">
      <svg width="20" height="20" viewBox="2.4 2.4 19.2 19.2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.76" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <figure class="lightbox-stage">
      <img alt="" decoding="async" />
    </figure>

    <button class="lightbox-nav lightbox-nav--next" type="button" aria-label="Next photograph">
      <svg width="20" height="20" viewBox="2.4 2.4 19.2 19.2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.76" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <div class="lightbox-bar">
      <span class="lightbox-counter"></span>
      <button class="lightbox-btn" type="button" data-lightbox-play aria-pressed="false">
        <svg data-icon-play width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        <svg data-icon-pause width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
        <span data-play-label>Slideshow</span>
      </button>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false">
    <span class="sr-only">Light theme</span>
    <span class="theme-toggle-rail" aria-hidden="true">
      <span class="theme-toggle-end theme-toggle-end--sun">
        <svg class="icon-sun" width="14" height="14" viewBox="0.57 0.57 22.86 22.86" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.14" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </span>
      <span class="theme-toggle-words">
        <span class="theme-toggle-word">Swipe to change mode</span>
      </span>
      <span class="theme-toggle-end theme-toggle-end--moon">
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </span>
      <span class="theme-toggle-knob">
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
        <svg class="icon-sun" width="14" height="14" viewBox="0.57 0.57 22.86 22.86" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.14" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </span>
    </span>
  </button>

  <script src="script.js"></script>
</body>
</html>
