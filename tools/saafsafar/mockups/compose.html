<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Saaf Safar mockup composer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Puts Saaf Safar screens into the three mockup photos (same photos and geometry as Easy CMS). Opened by tools/saafsafar/capture.js (group "mock") as compose.html?m=angled|desk|phone and captured at 2x into assets/saafsafar/mock-*.jpg. */
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #000; }
  #stage { position: relative; overflow: hidden; }
  #stage > img.photo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; background: #101114; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .gloss { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.06) 100%); }
  .status { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 9% 0 10%; font: 700 15px/1 "Plus Jakarta Sans", system-ui, sans-serif; color: #0b1230; background: #eef1fa; }
  .status i { display: inline-block; width: 26px; height: 12px; border-radius: 3.5px; border: 1.6px solid #0b1230; position: relative; }
  .status i::after { content: ""; position: absolute; inset: 1.6px; width: 70%; border-radius: 1.5px; background: #0b1230; }
  .island { position: absolute; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const M = {
  // Angled monitor, 736 x 981. Top edge y = 62 + 0.2583(x - 100); bottom edge y = 601 + 0.2231(x - 90);
  // left edge x = 86 - 0.01875(y - 80). The right edge is off the photo: it is placed so the
  // original UI's card edge (u = 0.4478 across the screen) lands where it sits in the photo (x 477 at y 300).
  angled: { photo: 'monitor-angled.png', w: 736, h: 981, shot: '../../../assets/saafsafar/m-terminal.webp', sw: 1440, sh: 900 },
  // Monitor on a desk, 1200 x 900, front-on: screen x 160-1041, y 133-629.
  // The viewer's head overlaps the lower left; pixels darker than the old UI (luminance < 9) stay in front.
  desk: { photo: 'monitor-desk.png', w: 1200, h: 900, shot: '../../../assets/saafsafar/m-story.webp', sw: 1440, sh: 900,
          quad: [[160, 133], [1041, 133], [1041, 629], [160, 629]], keep: { x0: 150, x1: 360, y0: 455, y1: 640 } },
  // Phone in hand, 800 x 800: screen x 297-503, y 93-539, corner radius 33; Dynamic Island x 369.5-427, y 99.5-117.5.
  phone: { photo: 'phone-hand.png', w: 800, h: 800, shot: '../../../assets/saafsafar/m-phone.webp', sw: 393, sh: 852,
           quad: [[297, 93], [503, 93], [503, 539], [297, 539]], radius: 33 }, // the capture carries its own status bar and island
};

// Unit square to quad (Heckbert). Corners in order: (0,0) (1,0) (1,1) (0,1).
function square2quad(q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, h = (dx1 * sy - sx * dy1) / den;
  return { a: x1 - x0 + g * x1, b: x3 - x0 + h * x3, c: x0, d: y1 - y0 + g * y1, e: y3 - y0 + h * y3, f: y0, g, h };
}
const apply = (H, u, v) => { const w = H.g * u + H.h * v + 1; return [(H.a * u + H.b * v + H.c) / w, (H.d * u + H.e * v + H.f) / w]; };
const matrix3d = (H, W, Hh) => `matrix3d(${H.a / W},${H.d / W},0,${H.g / W},${H.b / Hh},${H.e / Hh},0,${H.h / Hh},0,0,1,0,${H.c},${H.f},0,1)`;

function angledQuad() {
  const top = (x) => 62 + 0.2583 * (x - 100);
  const bot = (x) => 601 + 0.2231 * (x - 90);
  const TL = [86.4, 58.5], BL = [76.3, 597.9];
  const quadFor = (X) => {
    const yT = top(X);
    const t = (601 + 0.2231 * (X - 90) - yT) / (1 + 0.2231 * 0.01875);
    return [TL, [X, yT], [X - 0.01875 * t, yT + t], BL];
  };
  // Solve for the far edge so the reference card edge lands at x = 477 on row y = 300.
  let lo = 740, hi = 6000;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    const H = square2quad(quadFor(mid));
    let v0 = 0, v1 = 1;
    for (let j = 0; j < 40; j++) { const vm = (v0 + v1) / 2; if (apply(H, 0.4478, vm)[1] < 300) v0 = vm; else v1 = vm; }
    const x = apply(H, 0.4478, (v0 + v1) / 2)[0];
    if (x > 477) hi = mid; else lo = mid;
  }
  return quadFor((lo + hi) / 2);
}

const load = (src) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; });

(async () => {
  const key = new URLSearchParams(location.search).get('m') || 'desk';
  const m = M[key];
  const stage = document.getElementById('stage');
  stage.style.width = m.w + 'px';
  stage.style.height = m.h + 'px';
  const photo = await load(m.photo);
  photo.className = 'photo';
  stage.appendChild(photo);

  const quad = key === 'angled' ? angledQuad() : m.quad;
  const H = square2quad(quad);
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.style.width = m.sw + 'px';
  screen.style.height = m.sh + 'px';
  screen.style.transform = matrix3d(H, m.sw, m.sh);
  if (m.radius) screen.style.borderRadius = (m.radius * m.sw / (quad[1][0] - quad[0][0])) + 'px';
  const shot = await load(m.shot);
  if (m.status) {
    const bar = document.createElement('div');
    bar.className = 'status';
    bar.style.height = m.status + 'px';
    bar.innerHTML = '<span>9:41</span><i></i>';
    screen.appendChild(bar);
    shot.style.position = 'absolute';
    shot.style.top = m.status + 'px';
    shot.style.height = (m.sh - m.status) + 'px';
  }
  screen.appendChild(shot);
  const gloss = document.createElement('div');
  gloss.className = 'gloss';
  screen.appendChild(gloss);
  stage.appendChild(screen);

  if (m.island) {
    const [x, y, w, h] = m.island;
    const isl = document.createElement('div');
    isl.className = 'island';
    Object.assign(isl.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: h / 2 + 'px' });
    stage.appendChild(isl);
  }

  if (m.keep) {
    // Keep the viewer's silhouette in front of the new screen.
    const c = document.createElement('canvas');
    c.width = m.w; c.height = m.h;
    const g = c.getContext('2d');
    g.drawImage(photo, 0, 0);
    const src = g.getImageData(0, 0, m.w, m.h);
    const out = g.createImageData(m.w, m.h);
    const k = m.keep;
    const lumAt = (x, y) => { const i = (y * m.w + x) * 4; return 0.299 * src.data[i] + 0.587 * src.data[i + 1] + 0.114 * src.data[i + 2]; };
    // Head width per row: run in from the left edge through near-black pixels.
    const run = {};
    for (let y = k.y0; y < k.y1; y++) { let x = k.x0; while (x < k.x1 && lumAt(x, y) < 10) x++; run[y] = x; }
    // Vertical opening: a row only keeps what its neighbours also keep, so thin dark UI lines
    // that happen to touch the head drop out while the curved silhouette stays.
    const reach = 4;
    for (let y = k.y0; y < k.y1; y++) {
      let w = Infinity;
      for (let j = y - reach; j <= y + reach; j++) w = Math.min(w, run[Math.max(k.y0, Math.min(k.y1 - 1, j))]);
      for (let x = k.x0; x < Math.min(w + 2, k.x1); x++) {
        const lum = lumAt(x, y);
        const a = x < w ? 1 : Math.max(0, Math.min(1, (14 - lum) / 10));
        if (!a) continue;
        const i = (y * m.w + x) * 4;
        out.data[i] = src.data[i]; out.data[i + 1] = src.data[i + 1]; out.data[i + 2] = src.data[i + 2]; out.data[i + 3] = Math.round(a * 255);
      }
    }
    g.clearRect(0, 0, m.w, m.h);
    g.putImageData(out, 0, 0);
    stage.appendChild(c);
  }

  await document.fonts.ready;
  document.body.dataset.ready = '1';
  window.__quad = quad;
})();
</script>
</body>
</html>
