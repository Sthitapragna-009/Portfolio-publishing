<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Saaf Safar cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Composed once and captured to assets/saafsafar/card.jpg (1600 x 1000) by capture.js (group "cover") */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body { position: relative; font-family: "Inter Tight", system-ui, sans-serif; color: #EEF0F2; background: #101114; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#1b1e24 1px, transparent 1px), linear-gradient(90deg, #1b1e24 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(80% 90% at 70% 50%, #000 30%, transparent 80%); }
  .glow { position: absolute; width: 900px; height: 900px; right: -200px; top: -200px; border-radius: 50%; background: radial-gradient(circle, rgba(37,71,232,.45), rgba(37,71,232,0) 62%); }
  .text { position: absolute; left: 90px; top: 110px; width: 520px; display: grid; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 34px; letter-spacing: -.02em; }
  .brand small { display: block; font-family: "Noto Sans Devanagari", sans-serif; font-size: 18px; font-weight: 600; color: #8E99A7; letter-spacing: 0; }
  .kicker { justify-self: start; padding: 8px 16px; border-radius: 999px; background: #000; color: #FDE934; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  h1 { font-size: 70px; line-height: 1; letter-spacing: -.045em; font-weight: 900; }
  h1 em { font-style: normal; color: #FDE934; }
  .sub { font-size: 21px; line-height: 1.5; color: #C3CAD3; }
  .ipad { position: absolute; left: 600px; top: 150px; width: 1060px; filter: drop-shadow(0 50px 80px rgba(0,0,0,.6)); }
  .phone { position: absolute; left: 560px; top: 520px; width: 230px; filter: drop-shadow(0 40px 60px rgba(0,0,0,.7)); }
  .chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-radius: 18px; font-size: 19px; font-weight: 800; box-shadow: 0 24px 50px rgba(0,0,0,.5); }
  .chip-now { left: 880px; top: 84px; background: #E5302A; color: #fff; }
  .chip-ok { right: 60px; bottom: 60px; background: #C6F04A; color: #101114; }
  .chip-data { left: 90px; bottom: 90px; background: #16181C; border: 1px solid #2F343C; color: #EEF0F2; font-weight: 600; font-size: 17px; }
  .chip-data b { padding: 4px 12px; border-radius: 999px; background: #FDE934; color: #000; font-size: 15px; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="text">
    <div class="brand"><img src="../../assets/saafsafar/logo.svg" width="58" height="58" alt="" /><span>Saaf Safar<small>साफ़ सफ़र</small></span></div>
    <span class="kicker">Delhi T3 · airport housekeeping</span>
    <h1>The washroom that needs you, <em>right now.</em></h1>
    <p class="sub">Sensors tell cleaning crews where to go. Pictures first, Hindi first, built for gloved hands.</p>
  </div>
  <img class="ipad" src="../../assets/saafsafar/c-offer.webp" alt="" />
  <img class="phone" src="../../assets/saafsafar/ch-lock.webp" alt="" />
  <div class="chip chip-now"><svg width="20" height="20" viewBox="0 0 48 48" fill="#fff"><path d="M28 3L9 27h12l-3.5 18L39 20H26.5z"/></svg>Go now · Gate 14 · bin, tissue ×4</div>
  <div class="chip chip-ok"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="#101114" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 25l9 9 19-20"/></svg>Sensor confirmed clean</div>
  <div class="chip chip-data"><b>Simulated</b> one week · 4,068 tasks · 27 sensors</div>
</body>
</html>
