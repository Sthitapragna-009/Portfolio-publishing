<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Khatiq cover</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Composed once and captured to assets/cashflow/card.webp (1600 x 1000) by capture.js cover.
     Same language as the case study: black canvas, Epilogue, colour only as three small squares. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body { position: relative; background: #0b0b0b; color: #f3f3f1; font-family: "Epilogue", system-ui, sans-serif; }
  .photo { position: absolute; left: 289px; top: -153px; height: 1400px; width: 2100px; background: url("../../assets/cashflow/mk-sofa.webp") left top / 2100px 1400px no-repeat; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0b 0, #0b0b0b 460px, rgba(11,11,11,0) 640px); }
  .text { position: absolute; left: 96px; top: 112px; width: 640px; }
  .label { font-size: 22px; font-weight: 500; color: #8a8a88; letter-spacing: .005em; }
  h1 { margin-top: 40px; font-size: 220px; line-height: .86; font-weight: 700; letter-spacing: -.065em; }
  .hook { margin-top: 44px; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -.025em; }
  .desc { margin-top: 22px; width: 520px; font-size: 24px; line-height: 1.5; color: #a8a8a6; }
  .keys { position: absolute; left: 96px; bottom: 96px; display: flex; gap: 12px; }
  .keys i { width: 18px; height: 18px; display: block; }
</style>
</head>
<body>
  <div class="photo" aria-hidden="true"></div>
  <div class="text">
    <p class="label">Banking concept · iPhone, iPad, Apple Watch</p>
    <h1>Khatiq</h1>
    <p class="hook">Know before it bounces.</p>
    <p class="desc">Warns you three days before a payment bounces, then shows calm ways to fix it.</p>
  </div>
  <div class="keys" aria-hidden="true"><i style="background:#7ee8c2"></i><i style="background:#ffd65a"></i><i style="background:#ff8f78"></i></div>
</body>
</html>
